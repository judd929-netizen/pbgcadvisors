    <rect x="24" y="60" width="8" height="14" rx="2" fill="#1a5fb0"/>
    <rect x="38" y="48" width="8" height="26" rx="2" fill="#1a5fb0"/>
    <rect x="52" y="34" width="8" height="40" rx="2" fill="#1a5fb0"/>
